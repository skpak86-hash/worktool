<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Hub</title>
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f8f9fa;
    --border: #e2e6ea;
    --text: #1a1a2e;
    --text2: #6c757d;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc3545;
    --danger-hover: #c82333;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-hover: 0 6px 20px rgba(37,99,235,0.18);
    --group-header: #e8f0fe;
    --group-border: #c5d5fb;
    --input-bg: #ffffff;
    --card-bg: #ffffff;
    --card-hover: #f0f6ff;
  }
  [data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --text: #e8eaf6;
    --text2: #8892b0;
    --accent: #4f8ef7;
    --accent-hover: #2563eb;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-hover: 0 6px 20px rgba(79,142,247,0.25);
    --group-header: #1e2340;
    --group-border: #2e3a6e;
    --input-bg: #1a1d27;
    --card-bg: #1a1d27;
    --card-hover: #1e2a45;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    flex-shrink: 0;
  }
  .logo-icon { font-size: 1.4rem; }
  .logo-sub {
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text2);
    margin-left: 0.2rem;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .btn {
    padding: 0.42rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--border); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-danger { color: var(--danger); border-color: transparent; background: transparent; }
  .btn-danger:hover { background: #fff0f0; border-color: var(--danger); }
  [data-theme="dark"] .btn-danger:hover { background: #2a1515; }

  /* ADD TOOL PANEL */
  .add-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
  }
  .add-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .add-row input, .add-row select {
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    border-radius: 6px;
    padding: 0.45rem 0.8rem;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }
  .add-row input:focus, .add-row select:focus { border-color: var(--accent); }
  .input-group { flex: 1; min-width: 100px; }
  .input-url { flex: 2.5; min-width: 180px; }
  .add-hint {
    font-size: 0.72rem;
    color: var(--text2);
    margin-top: 0.45rem;
  }
  .add-hint kbd {
    background: var(--border);
    border-radius: 3px;
    padding: 0.1rem 0.3rem;
    font-size: 0.68rem;
    font-family: monospace;
  }

  /* MAIN CONTENT */
  main { padding: 1.5rem; }

  /* GROUP */
  .group-block {
    margin-bottom: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .group-header {
    background: var(--group-header);
    border-bottom: 1px solid var(--group-border);
    padding: 0.6rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: grab;
    user-select: none;
  }
  .group-header:active { cursor: grabbing; }
  .drag-handle {
    color: var(--text2);
    font-size: 1rem;
    cursor: grab;
    padding: 0 2px;
    opacity: 0.5;
  }
  .group-name {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    flex: 1;
  }
  .group-count {
    font-size: 0.7rem;
    color: var(--text2);
    background: var(--border);
    border-radius: 10px;
    padding: 0.1rem 0.5rem;
  }
  .group-del-btn {
    background: none;
    border: none;
    color: var(--text2);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0.1rem 0.3rem;
    border-radius: 4px;
    opacity: 0.5;
    transition: all 0.15s;
  }
  .group-del-btn:hover { opacity: 1; color: var(--danger); }

  /* TOOL CARDS GRID */
  .tools-grid {
    display: flex;
    flex-wrap: wrap;
    padding: 0.8rem;
    gap: 0.6rem;
  }

  /* TOOL CARD */
  .tool-card {
    position: relative;
    width: 82px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.65rem 0.4rem 0.55rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    transition: all 0.18s;
    text-decoration: none;
    color: var(--text);
    gap: 0.4rem;
  }
  .tool-card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .tool-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    object-fit: contain;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .tool-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
  }
  .tool-name {
    font-size: 0.68rem;
    font-weight: 500;
    text-align: center;
    line-height: 1.3;
    word-break: break-word;
    color: var(--text);
    max-width: 100%;
  }
  .tool-card-del {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    border: none;
    font-size: 0.65rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    z-index: 10;
  }
  .tool-card:hover .tool-card-del { display: flex; }
  .tool-card-del:hover { background: var(--danger-hover); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text2);
  }
  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text); }
  .empty-state p { font-size: 0.85rem; line-height: 1.6; }

  /* DRAG OVER */
  .group-block.drag-over { border-color: var(--accent); opacity: 0.7; }
  .group-block.dragging { opacity: 0.4; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: #222;
    color: #fff;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-size: 0.82rem;
    z-index: 9999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 1.5rem;
    width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h3 { margin-bottom: 1rem; font-size: 1rem; }
  .modal p { font-size: 0.85rem; color: var(--text2); margin-bottom: 1.2rem; line-height: 1.6; }
  .modal-btns { display: flex; gap: 0.5rem; justify-content: flex-end; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    header { padding: 0.7rem 1rem; }
    .logo-sub { display: none; }
    .add-panel { padding: 0.7rem 1rem; }
    main { padding: 1rem; }
    .btn { padding: 0.38rem 0.7rem; font-size: 0.78rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">⚡</span>
    Work Hub
    <span class="logo-sub">v1.0</span>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="exportData()">⬇ Export</button>
    <button class="btn" onclick="triggerImport()">⬆ Import</button>
    <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    <button class="btn btn-danger" onclick="confirmReset()">✕ Reset</button>
  </div>
</header>

<div class="add-panel">
  <div class="add-row">
    <input class="input-group" id="inGroup" type="text" placeholder="Group" list="groupList" autocomplete="off">
    <datalist id="groupList"></datalist>
    <input class="input-group" id="inName" type="text" placeholder="Name" autocomplete="off">
    <input class="input-url" id="inUrl" type="url" placeholder="URL (https://...)" autocomplete="off">
    <button class="btn btn-primary" onclick="addTool()">+ Add Tool</button>
  </div>
  <div class="add-hint">Press <kbd>Enter</kbd> in any field to add · Click card icon to open · Hover card to delete</div>
</div>

<main id="main"></main>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Confirm</h3>
    <p id="modalMsg"></p>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalOk" onclick="">OK</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="importData(event)">

<script>
// ── State ──────────────────────────────────────────────────────────────────
let data = { groups: [] }; // [{ name, tools: [{id, name, url, icon}] }]
let dragSrc = null;

// ── Init ───────────────────────────────────────────────────────────────────
(function init() {
  const saved = localStorage.getItem('workhub_v1');
  if (saved) {
    try { data = JSON.parse(saved); } catch(e) {}
  }
  const theme = localStorage.getItem('workhub_theme') || 'light';
  setTheme(theme);
  render();

  // Enter key on inputs
  ['inGroup','inName','inUrl'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') addTool();
    });
  });
})();

// ── Save ───────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('workhub_v1', JSON.stringify(data));
}

// ── Add Tool ───────────────────────────────────────────────────────────────
function addTool() {
  const group = document.getElementById('inGroup').value.trim();
  const name  = document.getElementById('inName').value.trim();
  let   url   = document.getElementById('inUrl').value.trim();

  if (!group || !name || !url) { toast('Please fill in Group, Name, and URL'); return; }
  if (!url.startsWith('http')) url = 'https://' + url;

  const icon = getFaviconUrl(url);
  const tool = { id: Date.now() + Math.random(), name, url, icon };

  let grp = data.groups.find(g => g.name.toLowerCase() === group.toLowerCase());
  if (!grp) {
    grp = { name: group, tools: [] };
    data.groups.push(grp);
  }
  grp.tools.push(tool);
  save();
  render();

  document.getElementById('inName').value = '';
  document.getElementById('inUrl').value = '';
  document.getElementById('inName').focus();
  toast(`"${name}" added to ${grp.name}`);
}

// ── Favicon ─────────────────────────────────────────────────────────────────
function getFaviconUrl(url) {
  try {
    const domain = new URL(url).hostname;
    return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  } catch { return ''; }
}

function getDomainEmoji(url) {
  try {
    const h = new URL(url).hostname.replace('www.','');
    return h.charAt(0).toUpperCase();
  } catch { return '?'; }
}

// ── Delete ─────────────────────────────────────────────────────────────────
function deleteTool(groupName, toolId, e) {
  e.preventDefault();
  e.stopPropagation();
  const grp = data.groups.find(g => g.name === groupName);
  if (!grp) return;
  grp.tools = grp.tools.filter(t => t.id !== toolId);
  if (grp.tools.length === 0) data.groups = data.groups.filter(g => g.name !== groupName);
  save();
  render();
}

function deleteGroup(groupName) {
  showModal(
    'Delete Group',
    `Delete the entire "${groupName}" group and all its tools?`,
    () => {
      data.groups = data.groups.filter(g => g.name !== groupName);
      save();
      render();
      closeModal();
      toast(`Group "${groupName}" deleted`);
    }
  );
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('main');

  // Update group datalist
  const dl = document.getElementById('groupList');
  dl.innerHTML = data.groups.map(g => `<option value="${escHtml(g.name)}">`).join('');

  if (data.groups.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔗</div>
        <h3>No tools yet</h3>
        <p>Enter a Group name, Tool name, and URL above<br>then click <strong>+ Add Tool</strong> to get started.</p>
      </div>`;
    return;
  }

  main.innerHTML = data.groups.map((grp, gi) => `
    <div class="group-block" draggable="true" data-gi="${gi}"
      ondragstart="onDragStart(event,${gi})"
      ondragover="onDragOver(event,${gi})"
      ondrop="onDrop(event,${gi})"
      ondragleave="onDragLeave(event,${gi})"
      ondragend="onDragEnd(event)">
      <div class="group-header">
        <span class="drag-handle">⠿</span>
        <span class="group-name">${escHtml(grp.name)}</span>
        <span class="group-count">${grp.tools.length}</span>
        <button class="group-del-btn" onclick="deleteGroup('${escAttr(grp.name)}')" title="Delete group">✕</button>
      </div>
      <div class="tools-grid">
        ${grp.tools.map(t => `
          <a class="tool-card" href="${escAttr(t.url)}" target="_blank" rel="noopener" title="${escAttr(t.name)}\n${escAttr(t.url)}">
            <button class="tool-card-del" onclick="deleteTool('${escAttr(grp.name)}',${t.id},event)" title="Remove">✕</button>
            <div class="tool-icon">
              ${t.icon
                ? `<img src="${escAttr(t.icon)}" alt="" onerror="this.parentNode.innerHTML='<span>${getDomainEmoji(t.url)}</span>'">`
                : `<span>${getDomainEmoji(t.url)}</span>`
              }
            </div>
            <div class="tool-name">${escHtml(t.name)}</div>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');
}

// ── Drag & Drop (reorder groups) ───────────────────────────────────────────
function onDragStart(e, gi) {
  dragSrc = gi;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e, gi) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (gi !== dragSrc) e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e, gi) {
  e.currentTarget.classList.remove('drag-over');
}
function onDrop(e, gi) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragSrc === null || dragSrc === gi) return;
  const moved = data.groups.splice(dragSrc, 1)[0];
  data.groups.splice(gi, 0, moved);
  dragSrc = null;
  save();
  render();
}
function onDragEnd(e) {
  document.querySelectorAll('.group-block').forEach(el => {
    el.classList.remove('dragging','drag-over');
  });
  dragSrc = null;
}

// ── Theme ──────────────────────────────────────────────────────────────────
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('workhub_theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
}

// ── Export / Import ────────────────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'workhub-backup.json';
  a.click();
  toast('Exported workhub-backup.json');
}
function triggerImport() {
  document.getElementById('fileInput').click();
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.groups) throw new Error('Invalid format');
      showModal(
        'Import Data',
        `Import ${imported.groups.length} group(s)? This will REPLACE all current data.`,
        () => {
          data = imported;
          save();
          render();
          closeModal();
          toast('Import successful');
        }
      );
    } catch(err) {
      toast('Import failed: invalid file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Reset ──────────────────────────────────────────────────────────────────
function confirmReset() {
  showModal(
    'Reset All Data',
    'This will delete ALL groups and tools. This cannot be undone.',
    () => {
      data = { groups: [] };
      save();
      render();
      closeModal();
      toast('All data cleared');
    }
  );
}

// ── Modal ──────────────────────────────────────────────────────────────────
function showModal(title, msg, onOk) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalOk').onclick = onOk;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Escape helpers ─────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
