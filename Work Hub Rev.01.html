<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Hub • English UI (Editable Links & Draggable Groups)</title>
    <link rel="icon" href="data:," />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --text: #2d3436;
            --card-bg: #ffffff;
            --group-bg: #e9ecef;
            --primary: #0984e3;
            --shadow: rgba(0, 0, 0, 0.08);
            --danger: #ff7675;

            --todo-color: #ffeaa7;
            --todo-border: #fdcb6e;
            --todo-header: #f9ca24;
            --pending-color: #ffd8a8;
            --pending-border: #fd9644;
            --pending-header: #fd9644;
            --done-color: #b2f2bb;
            --done-border: #51cf66;
            --done-header: #40c057;
        }

        body.dark-mode {
            --bg: #121212;
            --text: #dfe6e9;
            --card-bg: #1e1e1e;
            --group-bg: #2d2d2d;
            --primary: #74b9ff;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
            transition: background .25s, color .25s;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            font-size: .85rem;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        .btn[aria-pressed="true"] {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ── Main 3-column split layout ── */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            align-items: start;
        }

        /* ── LEFT: Kanban Todo Board ── */
        .todo-panel {
            background: var(--group-bg);
            border-radius: 16px;
            padding: 14px;
            min-height: 400px;
        }

        .todo-panel-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .todo-add-btn {
            font-size: 0.7rem;
            padding: 4px 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .kanban-board {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .kanban-col {
            border-radius: 12px;
            overflow: hidden;
        }

        .kanban-col-header {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .kanban-col[data-status="todo"] .kanban-col-header {
            background: var(--todo-header);
            color: #5f4900;
        }
        .kanban-col[data-status="pending"] .kanban-col-header {
            background: var(--pending-header);
            color: #5c2a00;
        }
        .kanban-col[data-status="done"] .kanban-col-header {
            background: var(--done-header);
            color: #1a4d24;
        }

        .kanban-col-count {
            background: rgba(0,0,0,0.15);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 0.65rem;
        }

        .kanban-drop-zone {
            min-height: 50px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kanban-col[data-status="todo"] .kanban-drop-zone {
            background: var(--todo-color);
        }
        .kanban-col[data-status="pending"] .kanban-drop-zone {
            background: var(--pending-color);
        }
        .kanban-col[data-status="done"] .kanban-drop-zone {
            background: var(--done-color);
        }

        /* Sticky Note Card */
        .sticky-note {
            border-radius: 8px;
            padding: 0;
            box-shadow: 2px 3px 8px rgba(0,0,0,0.13);
            cursor: grab;
            overflow: hidden;
            transition: box-shadow 0.15s, transform 0.1s;
        }

        .sticky-note:hover {
            box-shadow: 3px 5px 14px rgba(0,0,0,0.2);
            transform: translateY(-1px);
        }

        .sticky-note[data-status="todo"] {
            background: var(--todo-color);
            border-left: 4px solid var(--todo-border);
        }
        .sticky-note[data-status="pending"] {
            background: var(--pending-color);
            border-left: 4px solid var(--pending-border);
        }
        .sticky-note[data-status="done"] {
            background: var(--done-color);
            border-left: 4px solid var(--done-border);
        }

        .sticky-subject {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 8px 4px 8px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            color: #333;
        }

        .sticky-subject-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sticky-body {
            font-size: 0.68rem;
            padding: 5px 8px 6px 8px;
            color: #444;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 24px;
            line-height: 1.5;
        }

        .sticky-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .sticky-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.65rem;
            color: #555;
            opacity: 0.7;
        }

        .sticky-btn:hover { opacity: 1; }
        .sticky-btn.del { color: #c0392b; }

        /* Sortable ghost */
        .sortable-ghost {
            opacity: 0.3;
        }

        /* ── RIGHT: existing work hub ── */
        .hub-panel {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .input-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            display: grid;
            grid-template-columns: 140px 1fr 1fr 180px auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 24px;
        }

        @media (max-width: 760px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        input, select {
            padding: 12px;
            border: 1.5px solid var(--group-bg);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
        }

        .add-btn {
            padding: 12px 18px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .group-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: start;
        }

        .group {
            background: var(--group-bg);
            padding: 12px;
            border-radius: 16px;
            min-width: 200px;
            width: fit-content;
        }

        .group-title {
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .handle {
            cursor: grab;
            display: flex;
            align-items: center;
            opacity: .7;
        }

        .handle::before {
            content: '⠿';
            margin-right: 8px;
        }

        .link-list {
            display: flex;
            flex-flow: column wrap;
            max-height: 380px;
            gap: 6px;
            min-height: 40px;
        }

        .link-card {
            background: var(--card-bg);
            padding: 5px 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px var(--shadow);
            gap: 6px;
            width: 180px;
            box-sizing: border-box;
        }

        .link-info {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text);
            gap: 6px;
            flex: 1;
            overflow: hidden;
            font-size: 0.75rem;
        }

        .favicon {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            object-fit: cover;
            flex: 0 0 14px;
        }

        .name-ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            color: var(--text);
            font-size: 0.7rem;
        }

        .icon-btn.danger {
            color: var(--danger);
        }

        .hint {
            font-size: .7rem;
            opacity: .7;
        }

        #fileInput {
            display: none;
        }

        .drag-ghost {
            opacity: 0.4;
            background: var(--primary) !important;
        }

        /* Modal overlay for adding sticky notes */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            color: var(--text);
            border-radius: 14px;
            padding: 22px 24px;
            width: 340px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-box h3 {
            margin: 0;
            font-size: 0.95rem;
        }

        .modal-box input,
        .modal-box textarea,
        .modal-box select {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 11px;
            border: 1.5px solid var(--group-bg);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.82rem;
            outline: none;
            resize: vertical;
        }

        .modal-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-cancel {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 0.82rem;
        }

        .modal-confirm {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>⚡ Work Hub <small style="font-size:.55em; opacity:.6;">Compact v3.5</small></h1>
            <div class="controls">
                <button class="btn" id="exportBtn">Export</button>
                <button class="btn" id="importBtn">Import</button>
                <button class="btn" id="themeBtn">Theme</button>
                <button class="btn" id="resetBtn" style="color: var(--danger);">Reset</button>
                <input type="file" id="fileInput" accept=".json" />
            </div>
        </header>

        <div class="main-layout">

            <!-- LEFT: Sticky Note Kanban Board -->
            <div class="todo-panel">
                <div class="todo-panel-title">
                    📌 To-Do Board
                    <button class="todo-add-btn" id="openAddNote">+ Add Note</button>
                </div>
                <div class="kanban-board" id="kanbanBoard">
                    <div class="kanban-col" data-status="todo">
                        <div class="kanban-col-header">
                            🟡 To Do <span class="kanban-col-count" id="count-todo">0</span>
                        </div>
                        <div class="kanban-drop-zone" id="zone-todo"></div>
                    </div>
                    <div class="kanban-col" data-status="pending">
                        <div class="kanban-col-header">
                            🟠 Pending <span class="kanban-col-count" id="count-pending">0</span>
                        </div>
                        <div class="kanban-drop-zone" id="zone-pending"></div>
                    </div>
                    <div class="kanban-col" data-status="done">
                        <div class="kanban-col-header">
                            🟢 Done <span class="kanban-col-count" id="count-done">0</span>
                        </div>
                        <div class="kanban-drop-zone" id="zone-done"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Work Hub -->
            <div class="hub-panel">
                <section class="input-section">
                    <input type="text" id="groupName" placeholder="Group" />
                    <input type="text" id="siteName" placeholder="Name" />
                    <input type="url" id="siteUrl" placeholder="URL (https://...)" />
                    <select id="iconPicker">
                        <option value="auto">Auto-Icon</option>
                        <option value="https://cdn-icons-png.flaticon.com/512/5968/5968534.png">Email</option>
                        <option value="https://cdn-icons-png.flaticon.com/512/281/281760.png">Drive</option>
                        <option value="https://cdn-icons-png.flaticon.com/512/732/732220.png">Sheet</option>
                        <option value="https://cdn-icons-png.flaticon.com/512/1243/1243933.png">Web</option>
                        <option value="https://cdn-icons-png.flaticon.com/512/906/906334.png">Slack</option>
                        <option value="custom">Custom URL…</option>
                    </select>
                    <button class="add-btn" id="addBtn">Add Tool</button>
                    <div class="hint" style="grid-column: 1/-1;">Drag the <strong>handle</strong> ⠿ to reorder groups • Items overflow to next column after 10 rows</div>
                </section>

                <div id="dashboard" class="group-container"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Sticky Note Modal -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-box">
            <h3 id="modalTitle">Add Sticky Note</h3>
            <input type="text" id="noteSubject" placeholder="Subject" maxlength="60" />
            <textarea id="noteBody" placeholder="Details (optional)" rows="4"></textarea>
            <select id="noteStatus">
                <option value="todo">🟡 To Do</option>
                <option value="pending">🟠 Pending</option>
                <option value="done">🟢 Done</option>
            </select>
            <div class="modal-row">
                <button class="modal-cancel" id="modalCancel">Cancel</button>
                <button class="modal-confirm" id="modalConfirm">Save</button>
            </div>
        </div>
    </div>

    <template id="groupTemplate">
        <div class="group" data-id="">
            <div class="group-title">
                <div class="handle"></div>
                <span class="group-name" contenteditable="true" spellcheck="false"></span>
                <div class="group-actions">
                    <button class="icon-btn" data-action="delete-group">🗑️</button>
                </div>
            </div>
            <div class="link-list"></div>
        </div>
    </template>

    <template id="linkTemplate">
        <div class="link-card" data-id="">
            <a class="link-info" target="_blank" rel="noopener noreferrer">
                <img class="favicon" alt="" />
                <span class="name-ellipsis"></span>
            </a>
            <div style="display:flex;">
                <button class="icon-btn" data-action="edit">✏️</button>
                <button class="icon-btn danger" data-action="delete">✕</button>
            </div>
        </div>
    </template>

    <script>
        // ─────────────────────────────────────────────
        // WORK HUB STATE & LOGIC (original preserved)
        // ─────────────────────────────────────────────
        const SCHEMA_VERSION = 2;
        const storage = {
            load() {
                try {
                    const raw = JSON.parse(localStorage.getItem('workHubPayload')) || {};
                    if (!raw.version) return { version: SCHEMA_VERSION, links: [], groupOrder: [], dark: false };
                    return raw;
                } catch {
                    return { version: SCHEMA_VERSION, links: [], groupOrder: [], dark: false };
                }
            },
            save(state) {
                localStorage.setItem('workHubPayload', JSON.stringify({ ...state, version: SCHEMA_VERSION }));
            }
        };

        let state = storage.load();
        const $ = (sel, root = document) => root.querySelector(sel);
        const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

        function sanitizeUrl(url) {
            if (!url) return '';
            url = url.trim();
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            return url;
        }

        function autoIcon(url) {
            try {
                const u = new URL(url);
                return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`;
            } catch { return 'https://cdn-icons-png.flaticon.com/128/1243/1243933.png'; }
        }

        const dashboard = document.getElementById('dashboard');

        function render() {
            dashboard.innerHTML = '';
            const groups = [...new Set(state.links.map(l => l.group))].filter(g => g && String(g).trim() !== '');
            groups.sort((a, b) => {
                const ia = state.groupOrder.indexOf(a);
                const ib = state.groupOrder.indexOf(b);
                return (ia === -1 ? 9999 : ia) - (ib === -1 ? 9999 : ib);
            });

            groups.forEach(groupName => {
                const gFrag = document.importNode(document.getElementById('groupTemplate').content, true);
                const groupRoot = gFrag.querySelector('.group');
                const nameEl = gFrag.querySelector('.group-name');
                const listEl = gFrag.querySelector('.link-list');

                groupRoot.dataset.id = groupName;
                nameEl.textContent = groupName;

                nameEl.addEventListener('blur', () => {
                    const newName = nameEl.textContent.trim();
                    if (!newName || newName === groupName) { nameEl.textContent = groupName; return; }
                    state.links = state.links.map(l => l.group === groupName ? { ...l, group: newName } : l);
                    state.groupOrder = state.groupOrder.map(g => g === groupName ? newName : g);
                    storage.save(state); render();
                });

                gFrag.querySelector('[data-action="delete-group"]').addEventListener('click', () => {
                    if (!confirm('Delete group?')) return;
                    state.links = state.links.filter(l => l.group !== groupName);
                    state.groupOrder = state.groupOrder.filter(g => g !== groupName);
                    storage.save(state); render();
                });

                state.links.filter(l => l.group === groupName).forEach(link => {
                    const lFrag = document.importNode(document.getElementById('linkTemplate').content, true);
                    const card = lFrag.querySelector('.link-card');
                    const img = lFrag.querySelector('img.favicon');

                    card.dataset.id = link.id;
                    lFrag.querySelector('a.link-info').href = link.url;
                    img.src = link.iconUrl || autoIcon(link.url);
                    lFrag.querySelector('.name-ellipsis').textContent = link.name;

                    lFrag.querySelector('[data-action="delete"]').addEventListener('click', () => {
                        state.links = state.links.filter(x => x.id !== link.id);
                        storage.save(state); render();
                    });

                    lFrag.querySelector('[data-action="edit"]').addEventListener('click', () => {
                        const newName = prompt('New name:', link.name);
                        if (newName) {
                            state.links = state.links.map(x => x.id === link.id ? { ...x, name: newName.trim() } : x);
                            storage.save(state); render();
                        }
                    });

                    listEl.appendChild(lFrag);
                });

                dashboard.appendChild(gFrag);
            });

            new Sortable(dashboard, {
                handle: '.handle',
                animation: 150,
                onEnd: () => {
                    state.groupOrder = $$('.group', dashboard).map(el => el.dataset.id);
                    storage.save(state);
                }
            });

            $$('.link-list').forEach(listEl => {
                new Sortable(listEl, {
                    group: 'links',
                    animation: 150,
                    onAdd: (evt) => {
                        const movedId = Number(evt.item.dataset.id);
                        const newGroup = evt.to.closest('.group').dataset.id;
                        state.links = state.links.map(l => l.id === movedId ? { ...l, group: newGroup } : l);
                        storage.save(state);
                        render();
                    }
                });
            });

            document.body.classList.toggle('dark-mode', !!state.dark);
        }

        function addLink() {
            const group = $('#groupName').value.trim();
            const name = $('#siteName').value.trim();
            const url = sanitizeUrl($('#siteUrl').value);
            const iconSel = $('#iconPicker').value;
            if (!group || !name || !url) return;

            let finalIcon = iconSel === 'auto' ? autoIcon(url) : (iconSel === 'custom' ? prompt('Icon URL:') : iconSel);
            state.links.push({ id: Date.now(), group, name, url, iconUrl: finalIcon });
            if (!state.groupOrder.includes(group)) state.groupOrder.push(group);
            storage.save(state);
            $('#siteName').value = ''; $('#siteUrl').value = '';
            render();
        }

        $('#addBtn').addEventListener('click', addLink);
        $('#themeBtn').addEventListener('click', () => { state.dark = !state.dark; storage.save(state); render(); });
        $('#resetBtn').addEventListener('click', () => { if (confirm('Reset all data including notes?')) { state = { version: 2, links: [], groupOrder: [], dark: false }; storage.save(state); todoState = { notes: [] }; saveTodo(); renderKanban(); render(); } });
        $('#exportBtn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify({ hub: state, todo: todoState })], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hub.json'; a.click();
        });
        $('#importBtn').addEventListener('click', () => $('#fileInput').click());
        $('#fileInput').addEventListener('change', e => {
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if (parsed.hub && parsed.todo) {
                        state = parsed.hub;
                        todoState = parsed.todo;
                    } else {
                        state = parsed;
                    }
                    storage.save(state);
                    saveTodo();
                    render();
                    renderKanban();
                } catch { alert('Invalid file.'); }
            };
            reader.readAsText(e.target.files[0]);
        });

        // ─────────────────────────────────────────────
        // KANBAN TODO BOARD
        // ─────────────────────────────────────────────
        const TODO_KEY = 'workHubTodo';

        function loadTodo() {
            try { return JSON.parse(localStorage.getItem(TODO_KEY)) || { notes: [] }; }
            catch { return { notes: [] }; }
        }
        function saveTodo() {
            localStorage.setItem(TODO_KEY, JSON.stringify(todoState));
        }

        let todoState = loadTodo();
        let editingNoteId = null;

        const STATUSES = ['todo', 'pending', 'done'];

        function renderKanban() {
            STATUSES.forEach(status => {
                const zone = document.getElementById('zone-' + status);
                const notes = todoState.notes.filter(n => n.status === status);
                zone.innerHTML = '';
                notes.forEach(note => {
                    zone.appendChild(buildNoteEl(note));
                });
                document.getElementById('count-' + status).textContent = notes.length;
            });

            STATUSES.forEach(status => {
                const zone = document.getElementById('zone-' + status);
                new Sortable(zone, {
                    group: 'kanban',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: (evt) => {
                        const noteId = Number(evt.item.dataset.id);
                        const newStatus = evt.to.closest('.kanban-col').dataset.status;

                        // update status
                        todoState.notes = todoState.notes.map(n =>
                            n.id === noteId ? { ...n, status: newStatus } : n
                        );

                        // reorder within state to match DOM
                        const allZoneIds = STATUSES.flatMap(s =>
                            Array.from(document.getElementById('zone-' + s).querySelectorAll('.sticky-note'))
                                .map(el => Number(el.dataset.id))
                        );
                        todoState.notes.sort((a, b) => allZoneIds.indexOf(a.id) - allZoneIds.indexOf(b.id));

                        saveTodo();
                        updateCounts();

                        // update card color to match new status
                        evt.item.dataset.status = newStatus;
                    }
                });
            });
        }

        function updateCounts() {
            STATUSES.forEach(status => {
                document.getElementById('count-' + status).textContent =
                    todoState.notes.filter(n => n.status === status).length;
            });
        }

        function buildNoteEl(note) {
            const div = document.createElement('div');
            div.className = 'sticky-note';
            div.dataset.id = note.id;
            div.dataset.status = note.status;

            const subjectRow = document.createElement('div');
            subjectRow.className = 'sticky-subject';

            const subjectText = document.createElement('span');
            subjectText.className = 'sticky-subject-text';
            subjectText.textContent = note.subject;
            subjectText.title = note.subject;

            const actions = document.createElement('div');
            actions.className = 'sticky-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'sticky-btn';
            editBtn.textContent = '✏️';
            editBtn.title = 'Edit';
            editBtn.addEventListener('click', (e) => { e.stopPropagation(); openModal(note.id); });

            const delBtn = document.createElement('button');
            delBtn.className = 'sticky-btn del';
            delBtn.textContent = '✕';
            delBtn.title = 'Delete';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                todoState.notes = todoState.notes.filter(n => n.id !== note.id);
                saveTodo();
                renderKanban();
            });

            actions.appendChild(editBtn);
            actions.appendChild(delBtn);
            subjectRow.appendChild(subjectText);
            subjectRow.appendChild(actions);

            const body = document.createElement('div');
            body.className = 'sticky-body';
            body.textContent = note.body || '';

            div.appendChild(subjectRow);
            div.appendChild(body);
            return div;
        }

        // Modal logic
        const modal = document.getElementById('noteModal');

        function openModal(editId = null) {
            editingNoteId = editId;
            document.getElementById('modalTitle').textContent = editId ? 'Edit Note' : 'Add Sticky Note';
            if (editId) {
                const note = todoState.notes.find(n => n.id === editId);
                if (note) {
                    document.getElementById('noteSubject').value = note.subject;
                    document.getElementById('noteBody').value = note.body || '';
                    document.getElementById('noteStatus').value = note.status;
                }
            } else {
                document.getElementById('noteSubject').value = '';
                document.getElementById('noteBody').value = '';
                document.getElementById('noteStatus').value = 'todo';
            }
            modal.classList.add('open');
            document.getElementById('noteSubject').focus();
        }

        function closeModal() {
            modal.classList.remove('open');
            editingNoteId = null;
        }

        document.getElementById('openAddNote').addEventListener('click', () => openModal());
        document.getElementById('modalCancel').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        document.getElementById('modalConfirm').addEventListener('click', () => {
            const subject = document.getElementById('noteSubject').value.trim();
            if (!subject) { document.getElementById('noteSubject').focus(); return; }
            const body = document.getElementById('noteBody').value.trim();
            const status = document.getElementById('noteStatus').value;

            if (editingNoteId) {
                todoState.notes = todoState.notes.map(n =>
                    n.id === editingNoteId ? { ...n, subject, body, status } : n
                );
            } else {
                todoState.notes.push({ id: Date.now(), subject, body, status });
            }
            saveTodo();
            closeModal();
            renderKanban();
        });

        // Enter key in subject field triggers save
        document.getElementById('noteSubject').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('modalConfirm').click();
        });

        // ─────────────────────────────────────────────
        // INIT
        // ─────────────────────────────────────────────
        render();
        renderKanban();
    </script>
</body>

</html>
